name: Проверка абонемента 24h (Торрент)

# МОНИТОРИНГ ОТКЛЮЧЁН 2026-06-29 (парковка куплена).
# Чтобы снова включить: раскомментируй schedule ниже и убери "if: false" у job check.
on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Отправить тестовый пуш и выйти (проверка ntfy)"
        type: boolean
        default: false

# Чтобы параллельные запуски не топтались по состоянию.
concurrency:
  group: check-abono
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ОТКЛЮЧЕНО: job не выполняется даже при внешнем триггере. Убери строку, чтобы включить.
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Состояние для дедупликации писем хранится между запусками через cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: abono-state-${{ github.run_id }}
          restore-keys: |
            abono-state-

      - name: Run check
        env:
          IPK_USER: ${{ secrets.IPK_USER }}
          IPK_PASS: ${{ secrets.IPK_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TEST_PUSH: ${{ inputs.test_push }}
          PARKING_MATCH: ${{ vars.PARKING_MATCH }}
          ABONO_PRODUCT_RE: ${{ vars.ABONO_PRODUCT_RE }}
        run: npm run check

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: abono-state-${{ github.run_id }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            artifacts/
          if-no-files-found: ignore
          retention-days: 3
